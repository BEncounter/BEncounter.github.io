<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fnetlink 网络状态</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .container { max-width: 640px; width: 90%; background: #1e293b; border-radius: 16px; padding: 32px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1 { font-size: 24px; margin-bottom: 24px; text-align: center; color: #38bdf8; }
        .status-grid { display: grid; gap: 12px; }
        .status-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: #334155; border-radius: 10px; }
        .status-item .label { font-size: 15px; color: #94a3b8; }
        .status-item .value { font-weight: 600; font-size: 15px; }
        .online { color: #4ade80; }
        .offline { color: #f87171; }
        .pending { color: #facc15; }
        .pulse { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .pulse-green { background: #4ade80; box-shadow: 0 0 8px #4ade80; animation: pulse 2s infinite; }
        .pulse-red { background: #f87171; box-shadow: 0 0 8px #f87171; animation: pulse 2s infinite; }
        .pulse-yellow { background: #facc15; box-shadow: 0 0 8px #facc15; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .footer { text-align: center; margin-top: 20px; font-size: 13px; color: #64748b; }
        .refresh-btn { display: block; margin: 20px auto 0; padding: 10px 24px; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .refresh-btn:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Fnetlink 网络状态</h1>
        <div class="status-grid">
            <div class="status-item">
                <span class="label"><span class="pulse pulse-green"></span>主服务器</span>
                <span class="value online">在线</span>
            </div>
            <div class="status-item">
                <span class="label"><span class="pulse pulse-green"></span>备用服务器</span>
                <span class="value online">在线</span>
            </div>
            <div class="status-item">
                <span class="label"><span class="pulse pulse-yellow"></span>数据库集群</span>
                <span class="value pending">维护中</span>
            </div>
            <div class="status-item">
                <span class="label"><span class="pulse pulse-green"></span>CDN 节点</span>
                <span class="value online">在线</span>
            </div>
            <div class="status-item">
                <span class="label"><span class="pulse pulse-red"></span>API 网关</span>
                <span class="value offline">离线</span>
            </div>
        </div>
        <button class="refresh-btn" onclick="location.reload()">🔄 刷新状态</button>
        <div class="footer">最后更新：<span id="time"></span></div>
    </div>
    <script>document.getElementById('time').textContent = new Date().toLocaleString('zh-CN');</script>
</body>
</html>
