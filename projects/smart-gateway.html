<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fnetlink 智能网关</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0c1222 0%, #1a2744 100%); color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { max-width: 480px; width: 90%; background: rgba(30,41,59,0.85); backdrop-filter: blur(12px); border-radius: 20px; padding: 36px; border: 1px solid rgba(56,189,248,0.15); box-shadow: 0 12px 40px rgba(0,0,0,0.4); }
        .header { text-align: center; margin-bottom: 28px; }
        .header .icon { font-size: 48px; margin-bottom: 12px; }
        .header h1 { font-size: 22px; color: #38bdf8; }
        .header p { font-size: 13px; color: #94a3b8; margin-top: 6px; }
        .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 24px; }
        .metric { background: rgba(51,65,85,0.6); border-radius: 12px; padding: 16px; text-align: center; }
        .metric .num { font-size: 28px; font-weight: 700; color: #4ade80; }
        .metric .label { font-size: 12px; color: #94a3b8; margin-top: 4px; }
        .bar { height: 8px; background: #334155; border-radius: 4px; overflow: hidden; margin: 12px 0 24px; }
        .bar-fill { height: 100%; width: 78%; background: linear-gradient(90deg, #3b82f6, #4ade80); border-radius: 4px; }
        .footer { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
        .badge { display: inline-block; padding: 4px 10px; background: rgba(74,222,128,0.15); color: #4ade80; border-radius: 20px; font-size: 11px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <div class="icon">🌐</div>
            <h1>Fnetlink 智能网关</h1>
            <p>Enterprise Gateway v3.2</p>
        </div>
        <div class="metrics">
            <div class="metric">
                <div class="num">1,284</div>
                <div class="label">活跃连接</div>
            </div>
            <div class="metric">
                <div class="num">24ms</div>
                <div class="label">平均延迟</div>
            </div>
            <div class="metric">
                <div class="num">99.97%</div>
                <div class="label">可用性</div>
            </div>
            <div class="metric">
                <div class="num">78%</div>
                <div class="label">带宽利用率</div>
            </div>
        </div>
        <div class="bar"><div class="bar-fill"></div></div>
        <div class="footer">
            <span>运行时间: 47天</span>
            <span class="badge">● 运行中</span>
        </div>
    </div>
</body>
</html>
